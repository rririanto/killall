name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Verify Swift version
        run: swift --version

      - name: Run Swift Package Tests
        run: swift test --parallel

      - name: Build Standalone Application
        run: ./scripts/build_app.sh

      - name: Verify App Bundle Structure
        run: |
          test -f QuiteAll.app/Contents/MacOS/QuiteAll
          test -f QuiteAll.app/Contents/Info.plist
          test -f QuiteAll.app/Contents/Resources/AppIcon.icns
          codesign -dv QuiteAll.app
